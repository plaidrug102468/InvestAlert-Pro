name: Build InvestAlert Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare permanent InvestAlert signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.android"
          if gh release download investalert-signing --pattern investalert-debug.keystore --dir /tmp >/dev/null 2>&1; then
            cp /tmp/investalert-debug.keystore "$HOME/.android/debug.keystore"
            echo "Reusing permanent InvestAlert signing identity."
          else
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=InvestAlert Development,C=ZA"
            cp "$HOME/.android/debug.keystore" /tmp/investalert-debug.keystore
            gh release create investalert-signing /tmp/investalert-debug.keystore               --title "InvestAlert signing identity"               --notes "Private draft release used only to preserve the signing identity for InvestAlert updates."               --draft
          fi
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk InvestAlert-Pro-v1.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvestAlert-Pro-v1.3
          path: InvestAlert-Pro-v1.3.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3 >/dev/null 2>&1; then
            gh release upload v1.3 InvestAlert-Pro-v1.3.apk --clobber
          else
            gh release create v1.3 InvestAlert-Pro-v1.3.apk               --title "InvestAlert Pro v1.3"               --notes "InvestAlert Pro v1.3 Android APK. Clean-install InvestAlert Pro with multi-currency portfolio math, expanded asset search, crypto/forex scans, recent headlines and improved Trader Pro research."
          fi
