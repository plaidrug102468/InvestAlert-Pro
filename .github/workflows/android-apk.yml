name: Build InvestAlert Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare permanent InvestAlert signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.name=="InvestAlert signing identity" and .draft==true) | .id' | head -n1)"
          if [ -z "$RELEASE_ID" ]; then
            echo "Permanent signing release is missing; refusing to rotate signing identity."
            exit 1
          fi
          ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.assets[] | select(.name=="investalert-debug.keystore") | .id' | head -n1)"
          if [ -z "$ASSET_ID" ]; then
            echo "Permanent signing asset is missing; refusing to rotate signing identity."
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          CERT_SHA="$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | sha256sum | awk '{print $1}')"
          EXPECTED_SHA="1787682529e6ce8146d0dc789de7ea905cdab6e64a3cef6bd8d5e9657a555459"
          if [ "$CERT_SHA" != "$EXPECTED_SHA" ]; then
            echo "Signing certificate mismatch; refusing to build."
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $CERT_SHA"
            exit 1
          fi
          echo "Permanent InvestAlert signing identity verified."

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk InvestAlert-Pro-v1.5.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvestAlert-Pro-v1.5.2
          path: InvestAlert-Pro-v1.5.2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.5.2 >/dev/null 2>&1; then
            gh release upload v1.5.2 InvestAlert-Pro-v1.5.2.apk --clobber
          else
            gh release create v1.5.2 InvestAlert-Pro-v1.5.2.apk               --title "InvestAlert Pro v1.5.2"               --notes "InvestAlert Pro v1.5.2. Stable baseline build with screenshot import, themes, dropdown currencies, watchlist, transaction history, news links, configurable alerts and morning brief."
          fi
